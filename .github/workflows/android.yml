name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "android-config/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar o APK
        env:
          # Opcional: conteúdo do google-services.json do Firebase (notificações no Android).
          FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
        run: bash android-config/build-apk.sh ${{ github.run_number }}

      - name: Publicar para download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android rovibes.apk \
            --title "RoVibes Android 1.0.${{ github.run_number }}" \
            --notes "Baixe rovibes.apk no celular e instale. O app abre o RoVibes publicado na Vercel." \
            --latest
